<ion-header>
  <ion-toolbar>
    <ion-title>Game Survey Campus</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h2>Iniciar sesión</h2>

  <ion-item>
    <ion-input
      type="email"
      placeholder="Correo"
      [(ngModel)]="email">
    </ion-input>
  </ion-item>

  <br>

  <ion-item>
    <ion-input
      type="password"
      placeholder="Contraseña"
      [(ngModel)]="password">
    </ion-input>
  </ion-item>

  <br>

  <ion-button expand="block" (click)="login()">
    Ingresar
  </ion-button>

  <ion-button
    expand="block"
    fill="outline"
    routerLink="/register">

    Crear cuenta

  </ion-button>

</ion-content>
