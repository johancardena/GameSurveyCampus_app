<ion-content>

  <div class="login-container">

    <h1>🎮 GameSurvey</h1>

    <p class="subtitle">

      Inicia sesión para continuar

    </p>

    <ion-item>

      <ion-input
        type="email"
        placeholder="Correo"
        [(ngModel)]="email">

      </ion-input>

    </ion-item>

    <ion-item>

      <ion-input
        type="password"
        placeholder="Contraseña"
        [(ngModel)]="password">

      </ion-input>

    </ion-item>

    <ion-button
      expand="block"
      (click)="login()">

      Iniciar sesión

    </ion-button>

    <ion-button
      expand="block"
      fill="outline"
      routerLink="/register">

      Crear cuenta

    </ion-button>

  </div>

</ion-content>
