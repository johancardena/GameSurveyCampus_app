<ion-content>

  <div class="register-wrapper">

    <div class="register-container">

      <div class="header-section">
        <ion-icon name="arrow-back-outline" class="back-icon" routerLink="/login"></ion-icon>
        <h1>Crear Cuenta</h1>
        <p class="subtitle">Únete a nuestra comunidad gaming</p>
      </div>

      <div class="input-group">
        <div class="input-wrapper">
          <ion-icon name="person-outline" class="input-icon"></ion-icon>
          <ion-input
            type="text"
            placeholder="Nombre completo"
            [(ngModel)]="nombre"
            class="modern-input">
          </ion-input>
        </div>
      </div>

      <div class="input-group">
        <div class="input-wrapper">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <ion-input
            type="email"
            placeholder="Correo electrónico"
            [(ngModel)]="email"
            class="modern-input">
          </ion-input>
        </div>
      </div>

      <div class="input-group">
        <div class="input-wrapper">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <ion-input
            type="password"
            placeholder="Contraseña"
            [(ngModel)]="password"
            class="modern-input">
          </ion-input>
        </div>
        <p class="hint">Mínimo 6 caracteres</p>
      </div>

      <div class="input-group">
        <div class="input-wrapper">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <ion-input
            type="password"
            placeholder="Confirmar contraseña"
            [(ngModel)]="confirmPassword"
            class="modern-input">
          </ion-input>
        </div>
      </div>

      <ion-button
        expand="block"
        shape="round"
        class="register-button"
        (click)="register()">
        <ion-icon name="person-add-outline" slot="start"></ion-icon>
        Registrarse
      </ion-button>

      <div class="login-link">
        <span>¿Ya tienes cuenta?</span>
        <ion-button fill="clear" routerLink="/login">Inicia sesión</ion-button>
      </div>

    </div>

  </div>

</ion-content>
